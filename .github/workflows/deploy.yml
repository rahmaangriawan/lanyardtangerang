name: Deploy Lanyard Tangerang (Laravel Blade)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PHP_VERSION: "8.3"

jobs:
  deploy:
    name: Deploy Laravel ke CloudPanel via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package Laravel backend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy-package deploy.zip
          mkdir -p deploy-package

          cp -R apps/backend/. deploy-package/

          # Aset media legacy berada di luar apps/backend. Sertakan sebagai
          # payload terpisah agar dapat disinkronkan tanpa menghapus upload CMS.
          mkdir -p deploy-package/.deploy-assets/storage
          mkdir -p deploy-package/.deploy-assets/media
          mkdir -p deploy-package/.deploy-assets/uploads
          cp -R deploy/initial-media/. deploy-package/.deploy-assets/storage/
          cp -R public/media/. deploy-package/.deploy-assets/media/
          cp -R public/uploads/. deploy-package/.deploy-assets/uploads/

          rm -rf deploy-package/vendor
          rm -rf deploy-package/node_modules
          rm -rf deploy-package/storage/logs/*
          rm -rf deploy-package/tests
          rm -rf deploy-package/.phpunit.result.cache
          rm -rf deploy-package/.editorconfig
          rm -rf deploy-package/.gitattributes
          rm -f  deploy-package/README.md

          cd deploy-package
          zip -qr ../deploy.zip . -x "*.map" ".env" ".env.*"

      - name: Install SSH tooling
        run: sudo apt-get update && sudo apt-get install -y sshpass unzip

      - name: Upload & install
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          echo "Connecting to $SSH_USER@$SSH_HOST:$SSH_PORT ..."

          sshpass -p "$SSH_PASSWORD" scp \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -P "$SSH_PORT" \
            deploy.zip \
            "$SSH_USER@$SSH_HOST:deploy-lanyardtangerang.zip"

          sshpass -p "$SSH_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            bash -s <<'REMOTE_SCRIPT'
          set -euo pipefail

          APP_DIR="/home/lanyardtangerang/htdocs/lanyardtangerang.com"
          STAGING_DIR="$HOME/.deploy-lanyardtangerang-$(date +%s)"
          PHP_BIN="/usr/bin/php${PHP_VERSION:-8.3}"

          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"

          unzip -q "$HOME/deploy-lanyardtangerang.zip" -d "$STAGING_DIR"
          rm -f "$HOME/deploy-lanyardtangerang.zip"

          # Backup .env
          if [ -f "$APP_DIR/.env" ]; then
            cp "$APP_DIR/.env" "$STAGING_DIR/.env"
          fi

          # Sync aplikasi tanpa menghapus upload yang dibuat dari CMS produksi.
          mkdir -p "$APP_DIR"
          rsync -r --checksum --delete \
            --no-times --no-perms --no-owner --no-group --omit-dir-times \
            --exclude '.env' \
            --exclude '.deploy-assets/' \
            --exclude 'storage/' \
            --exclude 'public/uploads/' \
            --exclude 'public/storage/' \
            --exclude 'publicimagestrust/' \
            "$STAGING_DIR/" "$APP_DIR/"

          # Deploy aset bawaan repo secara non-destruktif. Folder ini sengaja
          # dikecualikan dari rsync --delete agar upload produksi tetap aman.
          if [ -d "$STAGING_DIR/public/uploads" ]; then
            mkdir -p "$APP_DIR/public/uploads"
            rsync -r --checksum \
              --no-times --no-perms --no-owner --no-group --omit-dir-times \
              "$STAGING_DIR/public/uploads/" "$APP_DIR/public/uploads/"
          fi

          if [ -d "$STAGING_DIR/storage/app/public/uploads" ]; then
            mkdir -p "$APP_DIR/storage/app/public/uploads"
            rsync -r --checksum \
              --no-times --no-perms --no-owner --no-group --omit-dir-times \
              "$STAGING_DIR/storage/app/public/uploads/" "$APP_DIR/storage/app/public/uploads/"
          fi

          if [ -d "$STAGING_DIR/.deploy-assets/storage" ]; then
            mkdir -p "$APP_DIR/storage/app/public"
            rsync -r --checksum \
              --no-times --no-perms --no-owner --no-group --omit-dir-times \
              "$STAGING_DIR/.deploy-assets/storage/" "$APP_DIR/storage/app/public/"
          fi

          if [ -d "$STAGING_DIR/.deploy-assets/media" ]; then
            mkdir -p "$APP_DIR/public/media"
            rsync -r --checksum \
              --no-times --no-perms --no-owner --no-group --omit-dir-times \
              "$STAGING_DIR/.deploy-assets/media/" "$APP_DIR/public/media/"
          fi

          if [ -d "$STAGING_DIR/.deploy-assets/uploads" ]; then
            mkdir -p "$APP_DIR/public/uploads"
            rsync -r --checksum \
              --no-times --no-perms --no-owner --no-group --omit-dir-times \
              "$STAGING_DIR/.deploy-assets/uploads/" "$APP_DIR/public/uploads/"
          fi

          rm -rf "$STAGING_DIR"

          cd "$APP_DIR"

          # Composer
          if command -v composer >/dev/null 2>&1; then
            $PHP_BIN $(which composer) install --no-dev --optimize-autoloader --no-interaction
          elif [ -f composer.phar ]; then
            $PHP_BIN composer.phar install --no-dev --optimize-autoloader --no-interaction
          fi

          # Pastiin folder cache ada
          mkdir -p storage/framework/views
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p bootstrap/cache

          $PHP_BIN artisan config:clear || true
          $PHP_BIN artisan cache:clear || true
          $PHP_BIN artisan view:clear || true
          $PHP_BIN artisan route:clear || true
          $PHP_BIN artisan migrate --force --no-interaction || true
          $PHP_BIN artisan storage:link --force || true

          chmod -R 775 storage bootstrap/cache 2>/dev/null || true

          # Build production caches after migrations. Route/config/view cache
          # failures must stop the deployment instead of leaving a slow app.
          $PHP_BIN artisan optimize
          $PHP_BIN artisan media:thumbnails

          # Gagalkan deploy jika aset penting tidak sampai ke document root.
          test -f public/uploads/lanyardtangerang-logo-header.webp
          test -f public/uploads/hero-lanyard-slider-01.webp
          test -f public/uploads/cta-bg.webp
          test -f public/js/public-site.js
          test -f public/fonts/geist/Geist-400.woff2
          test -f public/fonts/geist/Geist-700.woff2
          test -f public/fonts/inter/Inter-latin.woff2
          test -f storage/app/public/uploads/blog-import/rayakan-kemenangan-dengan-custom-lanyard-lebaran-unik-ini-01-9ju4eg.webp
          test -f storage/app/public/1791/lanyard-custom-bogor.webp
          test -f storage/app/public/1765/cetak-lanyard-bogor.webp
          test -f storage/app/public/1270/perbandingan-bahan-lanyard-nilon,-polyester-dan-tissue.webp
          test -f storage/app/public/1792/perbedaan-lanyard-sablon-vs-printing.webp
          test -f storage/app/public/1830/penjelasan-kenapa-harga-per-pcs-lebih-murah-ketika-order-banyak-lanyard.webp
          test -f storage/app/public/1979/rekomendasi-vendor-lanyard-bogor.webp
          test -f public/media/1791
          test -f public/media/1829
          test -f public/uploads/lanyard-telkomsel-1782278237998.webp
          test -f public/uploads/bank-indonesia-1782278433183.webp
          test -f public/uploads/universitas-indonesia-1782278573470.webp
          test -f public/uploads/kemenkes-ri-1782278922986.webp
          test -f public/uploads/rrq-1782279058422.webp
          test -f public/uploads/lanyard-ugm-1782279137305.webp

          echo "DONE: Deploy Lanyard Tangerang selesai — $(date)"
          REMOTE_SCRIPT
