name: Deploy Lanyard Tangerang (Laravel Blade)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: lanyardtangerang.com
  REMOTE_PATH: htdocs/lanyardtangerang.com
  PHP_VERSION: "8.3"

jobs:
  deploy:
    name: Deploy Laravel ke CloudPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package Laravel backend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy-package deploy.zip
          mkdir -p deploy-package

          cp -R apps/backend/. deploy-package/

          rm -rf deploy-package/vendor
          rm -rf deploy-package/node_modules
          rm -rf deploy-package/storage/logs/*
          rm -rf deploy-package/tests
          rm -rf deploy-package/.phpunit.result.cache
          rm -rf deploy-package/.editorconfig
          rm -rf deploy-package/.gitattributes
          rm -f  deploy-package/README.md

          cd deploy-package
          zip -qr ../deploy.zip . -x "*.map" ".env" ".env.*"

      - name: Install SSH tooling
        run: sudo apt-get update && sudo apt-get install -y sshpass unzip

      - name: Upload package
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          sshpass -p "$SSH_PASSWORD" scp \
            -o StrictHostKeyChecking=no \
            -P "$SSH_PORT" \
            deploy.zip \
            "$SSH_USER@$SSH_HOST:deploy-lanyardtangerang.zip"

      - name: Install dependencies & activate
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "PHP_VERSION='$PHP_VERSION' APP_NAME='$APP_NAME' REMOTE_PATH='$REMOTE_PATH' DEPLOY_ID='$GITHUB_SHA' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          APP_DIR="/home/tangerang/htdocs/lanyardtangerang.com"
          STAGING_DIR="$HOME/.deploy-lanyardtangerang-$(date +%s)"
          PHP_BIN="/usr/bin/php${PHP_VERSION:-8.3}"

          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"

          unzip -q "$HOME/deploy-lanyardtangerang.zip" -d "$STAGING_DIR"
          rm -f "$HOME/deploy-lanyardtangerang.zip"

          # Backup .env CloudPanel
          if [ -f "$APP_DIR/.env" ]; then
            cp "$APP_DIR/.env" "$STAGING_DIR/.env"
          fi

          # Backup uploads
          if [ -d "$APP_DIR/storage/app/public" ]; then
            mkdir -p "$STAGING_DIR/storage/app"
            cp -R "$APP_DIR/storage/app/public" "$STAGING_DIR/storage/app/" 2>/dev/null || true
          fi

          # Sync ke app dir (exclude file CMS biar gak kehapus)
          mkdir -p "$APP_DIR"
          rsync -r --checksum --delete \
            --no-times --no-perms --no-owner --no-group --omit-dir-times \
            --exclude '.env' \
            --exclude 'storage/' \
            --exclude 'public/uploads/' \
            --exclude 'public/storage/' \
            --exclude 'publicimagestrust/' \
            "$STAGING_DIR/" "$APP_DIR/"

          rm -rf "$STAGING_DIR"

          cd "$APP_DIR"

          # Composer install pakai PHP versi CloudPanel
          if command -v composer >/dev/null 2>&1; then
            $PHP_BIN $(which composer) install --no-dev --optimize-autoloader --no-interaction
          elif [ -f composer.phar ]; then
            $PHP_BIN composer.phar install --no-dev --optimize-autoloader --no-interaction
          fi

          # Migration safe-mode
          $PHP_BIN artisan migrate --force --no-interaction || true

          # Clear & optimize
          $PHP_BIN artisan config:clear
          $PHP_BIN artisan cache:clear
          $PHP_BIN artisan view:clear
          $PHP_BIN artisan optimize

          # Storage symlink
          $PHP_BIN artisan storage:link --force || true

          # Fix permission CloudPanel (site user harus owner)
          chmod -R 775 storage bootstrap/cache 2>/dev/null || true

          echo ""
          echo "============================================"
          echo "  Deploy Lanyard Tangerang selesai!"
          echo "  $(date)"
          echo "============================================"
          REMOTE_SCRIPT
